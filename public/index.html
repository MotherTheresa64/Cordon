<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Cordon — rate limiting</title>
<style>
  :root{--ink:#14181d;--muted:#5b6670;--line:#e2e6ea;--bg:#f6f7f9;--card:#fff;--accent:#2f5bea;--ok:#177245;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px;letter-spacing:-.01em}
  h1 span{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  .pill{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
  main{max-width:900px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  input{padding:8px 10px;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;width:220px}
  button{font:inherit;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:26px}
  .chip{font:12.5px/1.4 ui-monospace,monospace;font-weight:700;padding:4px 9px;border-radius:6px}
  .chip.ok{background:#f2faf5;color:var(--ok)}
  .chip.no{background:#fdf4f3;color:var(--bad)}
  .out{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;margin:0;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:12px}
  .hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>Cordon<span>token-bucket rate limiting with exact Retry-After</span></h1>
  <span id="pill" class="pill">limit 5 / 1s</span>
</header>
<main>
  <section class="card">
    <label for="key">Key (one bucket per key)</label>
    <div class="row">
      <input id="key" type="text" value="user-1" aria-label="rate limit key" />
      <button id="one" type="button">Send one</button>
      <button id="burst" type="button">Send 8 quickly</button>
      <button id="reset" class="secondary" type="button">Reset buckets</button>
    </div>
    <div class="stats">
      <span>limit <b id="limit">–</b></span>
      <span>remaining <b id="remaining">–</b></span>
      <span>retry after <b id="retry">–</b></span>
    </div>
    <div id="chips" class="chips"></div>
    <p class="hint">The sixth request inside one second is refused. Wait a moment and the bucket refills continuously, not in one lump at the window edge.</p>
  </section>
  <section class="card">
    <label>Response headers from the last decision</label>
    <pre id="headers" class="out">–</pre>
  </section>
</main>
<script>
  const $ = (selector) => document.querySelector(selector);
  const history = [];

  async function send(times) {
    const key = $("#key").value.trim() || "user-1";
    const decisions = [];
    for (let i = 0; i < times; i++) {
      const res = await fetch("/hit", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key }),
      });
      decisions.push(await res.json());
    }
    history.push(...decisions.map((entry) => entry.decision.allowed ? "ok" : "no"));
    while (history.length > 24) history.shift();
    render(decisions[decisions.length - 1]);
  }

  function render(last) {
    if (!last) return;
    const chips = $("#chips");
    chips.replaceChildren();
    for (const allowed of history) {
      const chip = document.createElement("span");
      chip.className = "chip " + allowed;
      chip.textContent = allowed === "ok" ? "200" : "429";
      chips.append(chip);
    }
    $("#limit").textContent = last.decision.limit;
    $("#remaining").textContent = last.decision.remaining;
    $("#retry").textContent = last.decision.retryAfterMs ? last.decision.retryAfterMs + " ms" : "–";
    $("#headers").textContent = Object.entries(last.headers)
      .map(([name, value]) => name + ": " + value)
      .join("\n");
  }

  $("#one").addEventListener("click", () => send(1));
  $("#burst").addEventListener("click", () => send(8));
  $("#reset").addEventListener("click", async () => {
    await fetch("/reset", { method: "POST" });
    history.length = 0;
    $("#chips").replaceChildren();
    $("#headers").textContent = "–";
    $("#limit").textContent = "–";
    $("#remaining").textContent = "–";
    $("#retry").textContent = "–";
  });
</script>
</body>
</html>
